name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/charlesclottin/agent-griffty:${{ github.ref_name }} .
          docker tag ghcr.io/charlesclottin/agent-griffty:${{ github.ref_name }} ghcr.io/charlesclottin/agent-griffty:latest

      - name: Push Docker image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/charlesclottin/agent-griffty:${{ github.ref_name }}
          docker push ghcr.io/charlesclottin/agent-griffty:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            .env.example
